<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    .song {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
    }

    .song-artwork {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
    }
    .song-artwork.visible { display: block; }

    .song.visible { display: flex; animation: songSlideIn 0.5s ease-out; }

    @keyframes songSlideIn {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* NOW PLAYING label */
    .now-playing {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      margin-bottom: 2px;
    }

    /* Equalizer bars */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 4px;
      background: rgba(255,255,255,0.5);
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 60%; animation-delay: 0s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.3s; }
    .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.45s; }
    .eq-bar:nth-child(5) { height: 50%; animation-delay: 0.1s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-requester {
      font-size: 11px;
      font-weight: 600;
      color: var(--lex-faint);
    }
  </style>
</head>
<body>
  <div class="song lex lex-schlank" id="song">
    <div class="equalizer">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
    <img class="song-artwork" id="song-artwork" alt="" />
    <div class="song-info">
      <div class="now-playing">NOW PLAYING</div>
      <span class="song-title lex-title" id="song-title"></span>
      <span class="song-requester" id="song-requester"></span>
    </div>
  </div>

  <script src="/overlay/boot.js" data-overlay="song"></script>
  <script>
    const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
    const song = document.getElementById('song');
    const songTitle = document.getElementById('song-title');
    const songRequester = document.getElementById('song-requester');
    const songArtwork = document.getElementById('song-artwork');

    ws.onmessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      if (event === 'song-update') {
        song.classList.add('visible');
        songTitle.textContent = data.title || 'Unknown';
        songRequester.textContent = data.artist || '';
        if (data.artworkUrl) {
          songArtwork.src = data.artworkUrl;
          songArtwork.classList.add('visible');
        } else {
          songArtwork.classList.remove('visible');
        }
      }

      if (event === 'song-clear') {
        song.classList.remove('visible');
        songArtwork.classList.remove('visible');
      }
    };
  </script>
</body>
</html>
