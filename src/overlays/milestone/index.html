<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Achievement - OBS Overlay</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 40px;
  }

  .achievement {
    opacity: 0;
    transform: translateY(-40px) scale(0.7);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 26px;
    max-width: 100%;
    position: relative;
    overflow: hidden;
  }

  .achievement.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .achievement.hiding {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* The three levels set the accent rather than swapping colour rules —
     the left edge, the icon frame and the sparkles all follow it. */
  .achievement.minor { --art: var(--color-secondary); }
  .achievement.major { --art: var(--color-accent); }
  .achievement.epic {
    --art: var(--color-primary);
    animation: epicPulse 2s ease-in-out infinite;
  }

  @keyframes epicPulse {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 2px 18px color-mix(in srgb, var(--art) 20%, transparent); }
  }

  /* Icon box */
  .icon-box {
    width: 56px;
    height: 56px;
    min-width: 56px;
    border: 1px solid var(--lex-frame);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .achievement.epic .icon-box { border-color: var(--lex-frame-strong); }

  .icon-box svg { image-rendering: pixelated; }

  /* Text content */
  .text-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    z-index: 1;
  }

  .achievement-label {
    font-family: var(--font-display);
    font-size: 0.733rem;
    letter-spacing: 0;
    color: var(--color-secondary);
    font-style: italic;
  }

  .achievement-title {
    font-size: 1.6rem;
    word-break: break-word;
  }

  .achievement-sub {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.8rem;
    color: var(--color-secondary);
    letter-spacing: 0.08em;
  }

  /* Shine effect for epic */
  .shine {
    display: none;
    position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--art) 8%, transparent), transparent);
    animation: shineAnim 3s ease-in-out infinite;
    z-index: 0;
  }

  .achievement.epic .shine { display: block; }

  @keyframes shineAnim {
    0% { left: -100%; }
    50% { left: 200%; }
    100% { left: 200%; }
  }

  /* Sparkle particles for epic */
  .sparkles {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }

  .achievement.epic .sparkles { display: block; }

  .sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--art);
    border-radius: 50%;
    animation: sparkleFloat 2s ease-in-out infinite;
  }

  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(0); }
    30% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-25px); }
  }
</style>
</head>
<body>

<div class="achievement lex lex-schlank" id="achievement">
  <div class="shine"></div>
  <div class="sparkles" id="sparkles"></div>

  <div class="icon-box">
    <svg id="icon" width="32" height="32" viewBox="0 0 16 16" style="image-rendering:pixelated"></svg>
  </div>

  <div class="text-content">
    <div class="achievement-label" id="label">ACHIEVEMENT UNLOCKED</div>
    <div class="achievement-title lex-title" id="title">Milestone!</div>
    <div class="achievement-sub" id="sub"></div>
  </div>
</div>

<script src="/overlay/boot.js" data-overlay="milestone"></script>
<script>
const DURATION = { minor: 3000, major: 5000, epic: 8000 };

const ICONS = {
  minor: `
    <rect x="6" y="1" width="4" height="1" style="fill:var(--color-primary)"/>
    <rect x="5" y="2" width="6" height="1" style="fill:var(--color-primary)"/>
    <rect x="4" y="3" width="8" height="1" style="fill:var(--color-accent)"/>
    <rect x="4" y="4" width="8" height="3" style="fill:var(--color-accent)"/>
    <rect x="5" y="7" width="6" height="1" style="fill:var(--color-accent)"/>
    <rect x="6" y="8" width="4" height="1" style="fill:var(--color-accent)"/>
    <rect x="7" y="9" width="2" height="1" style="fill:var(--color-accent)"/>
    <rect x="6" y="10" width="4" height="2" style="fill:var(--color-accent)"/>
    <rect x="5" y="12" width="6" height="1" style="fill:var(--color-accent)"/>
    <rect x="7" y="4" width="2" height="2" style="fill:var(--color-primary)"/>
  `,
  major: `
    <rect x="6" y="0" width="4" height="1" style="fill:var(--color-accent)"/>
    <rect x="5" y="1" width="6" height="1" style="fill:var(--color-accent)"/>
    <rect x="4" y="2" width="8" height="1" style="fill:var(--color-accent)"/>
    <rect x="3" y="3" width="10" height="1" style="fill:var(--color-accent)"/>
    <rect x="3" y="4" width="10" height="3" style="fill:var(--color-accent)"/>
    <rect x="4" y="7" width="8" height="1" style="fill:color-mix(in srgb, var(--color-accent) 50%, var(--color-bg))"/>
    <rect x="5" y="8" width="6" height="1" style="fill:color-mix(in srgb, var(--color-accent) 50%, var(--color-bg))"/>
    <rect x="6" y="9" width="4" height="1" style="fill:color-mix(in srgb, var(--color-accent) 50%, var(--color-bg))"/>
    <rect x="5" y="10" width="6" height="2" style="fill:color-mix(in srgb, var(--color-accent) 50%, var(--color-bg))"/>
    <rect x="4" y="12" width="8" height="1" style="fill:var(--color-accent)"/>
    <rect x="6" y="4" width="4" height="2" style="fill:var(--color-accent)"/>
    <rect x="7" y="3" width="2" height="1" style="fill:var(--color-primary)"/>
  `,
  epic: `
    <rect x="7" y="0" width="2" height="1" style="fill:var(--color-primary)"/>
    <rect x="6" y="1" width="4" height="1" style="fill:var(--color-primary)"/>
    <rect x="5" y="2" width="6" height="1" style="fill:var(--color-primary)"/>
    <rect x="4" y="3" width="8" height="1" style="fill:var(--color-primary)"/>
    <rect x="3" y="4" width="10" height="1" style="fill:var(--color-accent)"/>
    <rect x="2" y="5" width="12" height="2" style="fill:var(--color-accent)"/>
    <rect x="3" y="7" width="10" height="1" style="fill:var(--color-accent)"/>
    <rect x="4" y="8" width="8" height="1" style="fill:var(--color-accent)"/>
    <rect x="5" y="9" width="6" height="1" style="fill:var(--color-accent)"/>
    <rect x="6" y="10" width="4" height="1" style="fill:color-mix(in srgb, var(--color-accent) 50%, var(--color-bg))"/>
    <rect x="5" y="11" width="6" height="2" style="fill:var(--color-accent)"/>
    <rect x="4" y="13" width="8" height="1" style="fill:var(--color-accent)"/>
    <rect x="6" y="5" width="4" height="2" style="fill:var(--color-primary)"/>
    <rect x="7" y="4" width="2" height="1" style="fill:var(--color-primary)"/>
    <rect x="7" y="3" width="2" height="1" style="fill:var(--color-primary)"/>
    <rect x="1" y="5" width="1" height="2" style="fill:var(--color-primary)"/>
    <rect x="14" y="5" width="1" height="2" style="fill:var(--color-primary)"/>
    <rect x="0" y="6" width="1" height="1" style="fill:var(--color-accent)"/>
    <rect x="15" y="6" width="1" height="1" style="fill:var(--color-accent)"/>
  `,
};

const LABELS = {
  minor: 'ACHIEVEMENT',
  major: 'ACHIEVEMENT UNLOCKED',
  epic: '★ LEGENDARY ACHIEVEMENT ★',
};

const SUBS = {
  minor: '',
  major: 'WELL DONE',
  epic: 'LEGENDARY',
};

let hideTimeout = null;

function buildSparkles() {
  let html = '';
  for (let i = 0; i < 12; i++) {
    const left = Math.random() * 100;
    const top = 60 + Math.random() * 40;
    const delay = Math.random() * 2;
    const dur = 1.5 + Math.random() * 1.5;
    html += `<div class="sparkle" style="left:${left}%;top:${top}%;animation-delay:${delay}s;animation-duration:${dur}s"></div>`;
  }
  document.getElementById('sparkles').innerHTML = html;
}

function show(data) {
  const el = document.getElementById('achievement');
  const level = data.level || 'minor';

  // Reset
  el.className = 'achievement lex lex-schlank ' + level;

  // Icon
  document.getElementById('icon').innerHTML = ICONS[level] || ICONS.minor;

  // Text
  document.getElementById('label').textContent = LABELS[level] || 'ACHIEVEMENT';
  document.getElementById('title').textContent = data.title || data.message || 'Milestone!';
  document.getElementById('sub').textContent = SUBS[level] || '';

  // Sparkles for epic
  if (level === 'epic') buildSparkles();

  // Show
  requestAnimationFrame(() => {
    el.classList.add('visible');
  });

  // Hide after duration
  if (hideTimeout) clearTimeout(hideTimeout);
  hideTimeout = setTimeout(() => {
    el.classList.remove('visible');
    el.classList.add('hiding');
    setTimeout(() => {
      el.className = 'achievement lex lex-schlank';
    }, 700);
  }, DURATION[level] || 3000);
}

// WebSocket
function connectWS() {
  const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'milestone-trigger') show(msg.data);
      if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);
    } catch {}
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => ws.close();
}

connectWS();
</script>
</body>
</html>
