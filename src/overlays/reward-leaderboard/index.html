<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Leaderboard</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
/* The Bestenliste shows up for a moment whenever someone redeems the list's
   reward (Nils, 06.10.): it slides in with the fresh Top 3, the viewer's row
   lights up, and it slides out again. In the showcase it simply stands. */
.leaderboard {
  display: flex;
  flex-direction: column;
  width: min(280px, 100%);
  /* Tighter than the full weight's own padding: 44px of side margin on a
     280px panel would leave the names barely half the width. */
  padding: 24px 26px 20px;
  opacity: 0;
  pointer-events: none;
}
.leaderboard.standing { opacity: 1; }
.leaderboard.slide-in { animation: slideIn 0.5s ease forwards; }
.leaderboard.slide-out { animation: slideOut 0.5s ease forwards; }

@keyframes slideIn {
  from { transform: translateX(-60px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
  from { transform: translateX(0); opacity: 1; }
  to   { transform: translateX(60px); opacity: 0; }
}

.header { margin-bottom: 10px; }

/* A rank is a line in a list, not a card of its own. */
.entry {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--lex-rule);
  transition: all 0.5s ease;
}

.entry:last-child { border-bottom: none; }

/* The viewer who just redeemed. */
.entry.me {
  background: color-mix(in srgb, var(--color-accent) 14%, transparent);
  margin: 0 -10px;
  padding-left: 10px;
  padding-right: 10px;
  border-radius: 6px;
}
/* The viewer's own row below the Top 3, when they are not in it. */
.entry.beyond { border-top: 1px dashed var(--lex-rule); margin-top: 4px; }

.rank {
  font-family: var(--font-display);
  font-size: 1.467rem;
  color: var(--lex-faint);
  min-width: 32px;
  text-align: right;
}
.entry.rank-1 .rank { color: var(--color-accent); }
.entry.rank-2 .rank { color: var(--color-secondary); }
.entry.rank-3 .rank { color: var(--lex-soft); }

.name {
  flex: 1;
  min-width: 0;
  font-size: 1.067rem;
  color: var(--color-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry.rank-1 .name { color: var(--color-primary); }

.count {
  font-family: var(--font-display);
  font-size: 1.267rem;
  color: var(--color-secondary);
  transition: transform 0.3s ease;
}

.count.updated {
  transform: scale(1.3);
}
</style>
</head>
<body>
<div class="leaderboard lex lex-voll" id="leaderboard">
  <div class="header lex-kicker" id="title">Bestenliste</div>
</div>

<script src="/overlay/boot.js" data-overlay="reward-leaderboard"></script>
<script>
const params = new URLSearchParams(window.location.search);
// One address serves every list (Nils, 06.10.): without ?type= the overlay
// shows whichever list just got a point; with ?type=<key> only that one.
const configuredType = params.get('type');
// In the showcase (?state=) the list stands still, so it can be looked at.
// The Beitrag lists of own points (2026-10-08) get a point with every chat line —
// they stand in the picture and count up instead of sliding in and out.
const POINT_BOARDS = ['beitrag', 'beitrag-stream'];
const standing = params.has('state') || POINT_BOARDS.includes(configuredType);
let shownType = configuredType || 'all';
const SHOW_MS = 6000;

const panel = document.getElementById('leaderboard');
let leaderboard = [];
let me = null;            // { login, user, count, rank } of the viewer who just redeemed
let hideTimer = null;
let fallbackInterval = null;

if (standing) panel.classList.add('standing');
async function fetchLeaderboard() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/reward-stats/top?type=${encodeURIComponent(shownType)}&limit=3`);
    const data = await res.json();
    leaderboard = data.leaderboard || [];
    if (data.title) document.getElementById('title').textContent = data.title;
    render();
  } catch (err) {
    console.error('[Leaderboard] Fetch failed:', err);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function row(entry, extraClass) {
  const el = document.createElement('div');
  const mine = me && entry.userName.toLowerCase() === me.login;
  el.className = `entry rank-${entry.rank}${mine ? ' me' : ''}${extraClass ? ' ' + extraClass : ''}`;
  el.dataset.user = entry.userName;
  el.innerHTML = `
    <span class="rank">#${entry.rank}</span>
    <span class="name">${escapeHtml(entry.userName)}</span>
    <span class="count">${entry.count}</span>
  `;
  return el;
}

function render() {
  const header = panel.querySelector('.header');
  panel.innerHTML = '';
  panel.appendChild(header);
  for (const entry of leaderboard) panel.appendChild(row(entry));
  // The viewer who just redeemed, below the Top 3 when they are not in it.
  if (me && !leaderboard.some((e) => e.userName.toLowerCase() === me.login)) {
    panel.appendChild(row({ rank: me.rank, userName: me.user, count: me.count }, 'beyond'));
  }
}

function flashCount(userName) {
  const el = panel.querySelector(`.entry[data-user="${CSS.escape(userName)}"] .count`);
  if (!el) return;
  el.classList.add('updated');
  setTimeout(() => el.classList.remove('updated'), 400);
}

/** Slide in (or stay in), and slide out SHOW_MS after the last point. */
function show() {
  if (standing) return;
  if (hideTimer) clearTimeout(hideTimer);
  if (!panel.classList.contains('slide-in')) {
    panel.classList.remove('slide-out');
    panel.classList.add('slide-in');
  }
  hideTimer = setTimeout(() => {
    panel.classList.remove('slide-in');
    panel.classList.add('slide-out');
    hideTimer = null;
    me = null;
  }, SHOW_MS);
}

async function handlePoint(data) {
  if (configuredType && data.key !== configuredType) return;
  if (!configuredType && POINT_BOARDS.includes(data.key)) return;
  shownType = data.key;
  me = { login: String(data.login || data.user || '').toLowerCase(), user: data.user, count: data.count, rank: data.rank };
  await fetchLeaderboard();
  flashCount(me.user);
  // The Top 3 keep Twitch's spelling of the login; match the row case-insensitively.
  const mine = leaderboard.find((e) => e.userName.toLowerCase() === me.login);
  if (mine) flashCount(mine.userName);
  show();
}

function handleLeaderboardUpdate(data) {
  if (data.type !== shownType) return;
  if (data.title) document.getElementById('title').textContent = data.title;
  const oldCounts = new Map(leaderboard.map((e) => [e.userName, e.count]));
  leaderboard = (data.leaderboard || []).map((e) => ({ rank: e.rank, userName: e.userName, count: e.count }));
  render();
  for (const entry of leaderboard) {
    const old = oldCounts.get(entry.userName);
    if (old !== undefined && old !== entry.count) flashCount(entry.userName);
  }
}

// Fallback polling
function startFallbackPolling() {
  if (fallbackInterval) return;
  fallbackInterval = setInterval(fetchLeaderboard, 10000);
}

function stopFallbackPolling() {
  if (fallbackInterval) {
    clearInterval(fallbackInterval);
    fallbackInterval = null;
  }
}

// WebSocket
function connectWS() {
  const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

  ws.onopen = () => {
    console.log('[Leaderboard] WebSocket connected');
    stopFallbackPolling();
    fetchLeaderboard();
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'leaderboard-point') handlePoint(msg.data);
      if (msg.event === 'reward-leaderboard-update') handleLeaderboardUpdate(msg.data);
      if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);
    } catch {}
  };

  ws.onclose = () => {
    console.log('[Leaderboard] WebSocket closed, reconnecting...');
    startFallbackPolling();
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => ws.close();
}

connectWS();
if (configuredType || standing) startFallbackPolling();
</script>
</body>
</html>
