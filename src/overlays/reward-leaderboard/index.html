<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Leaderboard</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
.leaderboard {
  display: flex;
  flex-direction: column;
  width: 280px;
  /* Tighter than the full weight's own padding: 44px of side margin on a
     280px panel would leave the names barely half the width. */
  padding: 24px 26px 20px;
}

.header { margin-bottom: 10px; }

/* A rank is a line in a list, not a card of its own. */
.entry {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--lex-rule);
  transition: all 0.5s ease;
}

.entry:last-child { border-bottom: none; }

.rank {
  font-family: var(--font-display);
  font-size: 1.467rem;
  color: var(--lex-faint);
  min-width: 32px;
  text-align: right;
}
.entry.rank-1 .rank { color: var(--color-accent); }
.entry.rank-2 .rank { color: var(--color-secondary); }
.entry.rank-3 .rank { color: var(--lex-soft); }

.name {
  flex: 1;
  min-width: 0;
  font-size: 1.067rem;
  color: var(--color-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry.rank-1 .name { color: var(--color-primary); }

.count {
  font-family: var(--font-display);
  font-size: 1.267rem;
  color: var(--color-secondary);
  transition: transform 0.3s ease;
}

.count.updated {
  transform: scale(1.3);
}
</style>
</head>
<body>
<div class="leaderboard lex lex-voll" id="leaderboard">
  <div class="header lex-kicker">Top Redeemer</div>
</div>

<script src="/overlay/boot.js" data-overlay="reward-leaderboard"></script>
<script>
const params = new URLSearchParams(window.location.search);
const configuredType = params.get('type') || 'all';

let leaderboard = [];
let wsConnected = false;
let fallbackInterval = null;

async function fetchLeaderboard() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/reward-stats/top?type=${configuredType}&limit=3`);
    const data = await res.json();
    leaderboard = data.leaderboard || [];
    render();
  } catch (err) {
    console.error('[Leaderboard] Fetch failed:', err);
  }
}

function render() {
  const container = document.getElementById('leaderboard');
  // Keep header, remove entries
  const header = container.querySelector('.header');
  container.innerHTML = '';
  container.appendChild(header);

  for (const entry of leaderboard) {
    const el = document.createElement('div');
    el.className = `entry rank-${entry.rank}`;
    el.dataset.user = entry.userName;
    el.innerHTML = `
      <span class="rank">#${entry.rank}</span>
      <span class="name">${escapeHtml(entry.userName)}</span>
      <span class="count">${entry.count}</span>
    `;
    container.appendChild(el);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function handleLeaderboardUpdate(data) {
  if (data.type !== configuredType) return;

  // Animate count changes
  const oldCounts = new Map(leaderboard.map(e => [e.userName, e.count]));
  leaderboard = (data.leaderboard || []).map(e => ({
    rank: e.rank,
    userName: e.userName,
    count: e.count,
  }));
  render();

  // Flash updated counts
  for (const entry of leaderboard) {
    const old = oldCounts.get(entry.userName);
    if (old !== undefined && old !== entry.count) {
      const el = document.querySelector(`.entry[data-user="${CSS.escape(entry.userName)}"] .count`);
      if (el) {
        el.classList.add('updated');
        setTimeout(() => el.classList.remove('updated'), 400);
      }
    }
  }
}

// Fallback polling
function startFallbackPolling() {
  if (fallbackInterval) return;
  fallbackInterval = setInterval(fetchLeaderboard, 10000);
}

function stopFallbackPolling() {
  if (fallbackInterval) {
    clearInterval(fallbackInterval);
    fallbackInterval = null;
  }
}

// WebSocket
function connectWS() {
  const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

  ws.onopen = () => {
    console.log('[Leaderboard] WebSocket connected');
    wsConnected = true;
    stopFallbackPolling();
    fetchLeaderboard();
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'reward-leaderboard-update') handleLeaderboardUpdate(msg.data);
      if (msg.event === 'reward-redeemed') fetchLeaderboard();
      if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);
    } catch {}
  };

  ws.onclose = () => {
    console.log('[Leaderboard] WebSocket closed, reconnecting...');
    wsConnected = false;
    startFallbackPolling();
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => ws.close();
}

connectWS();
startFallbackPolling();
</script>
</body>
</html>
