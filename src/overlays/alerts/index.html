<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    /* One Kompendium panel in the top right corner — the streamer's pick of
       29.09. ("Randnotiz"). Alerts come one after another, never stacked: a
       raid next to three follows would push itself off the screen. */
    .alert-slot {
      position: fixed;
      top: 40px;
      right: 40px;
    }

    .alert {
      --art: var(--color-accent);
      padding: 24px 32px 26px;
      background: color-mix(in srgb, var(--color-bg) calc(var(--color-bg-opacity) * 100%), transparent);
      color: var(--color-primary);
      animation: alertSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .alert.leaving { animation: alertSlideOut 0.4s ease-in forwards; }

    /* The occasion in the accent, then the stroke running to the edge. */
    .alert .alert-kicker { font-size: 1.1rem; color: var(--art); }

    .alert .line {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.2;
      margin-top: 12px;
    }
    .alert .who { color: var(--art); }

    /* What a viewer wrote along with a sub or cheer — their words, not ours. */
    .alert .said {
      font-style: italic;
      font-size: 1.1rem;
      color: var(--color-secondary);
      margin-top: 10px;
    }

    /* Three sizes: a follow in passing, a sub a little more, a raid the most. */
    .alert.klein { width: 560px; }
    .alert.klein .line { font-size: 2.1rem; }

    .alert.mittel { width: 660px; }
    .alert.mittel .line { font-size: 2.4rem; }

    .alert.gross {
      width: 900px;
      border-left: 8px solid var(--art);
    }
    .alert.gross .who { display: block; font-size: 3.8rem; line-height: 1.05; }
    .alert.gross .line { font-size: 2.2rem; margin-top: 14px; }

    @keyframes alertSlideIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes alertSlideOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(60px); }
    }
  </style>
</head>
<body>
  <div class="alert-slot" id="slot"></div>

  <script src="/overlay/boot.js" data-overlay="alerts"></script>
  <script>
    const slot = document.getElementById('slot');

    // What a redeemed reward did, in the same words as the rest.
    const REWARDS = {
      roulette: 'dreht am Glücksrad.',
      feature_request: 'schlägt etwas vor.',
      change_music: 'wechselt die Musik.',
    };

    // Size and time on screen, by kind. Whatever isn't listed is small.
    const WEIGHT = {
      follow: ['klein', 5000],
      sub: ['mittel', 6000],
      resub: ['mittel', 6000],
      subgift: ['mittel', 6000],
      cheer: ['mittel', 6000],
      raid: ['gross', 9000],
    };
    const LEAVE_MS = 400;

    const queue = [];
    let showing = false;

    function build({ label, who, text, message, kind = '' }) {
      const [size] = WEIGHT[kind] || ['klein'];
      const el = document.createElement('div');
      el.className = `alert lex ${size} ${kind}`;

      const kicker = document.createElement('div');
      kicker.className = 'lex-kicker alert-kicker';
      kicker.textContent = label;
      el.appendChild(kicker);

      const line = document.createElement('div');
      line.className = 'line';
      if (who) {
        const name = document.createElement('span');
        name.className = 'who';
        name.textContent = who;
        line.append(name, ` ${text}`);
      } else {
        line.textContent = text;
      }
      el.appendChild(line);

      if (message) {
        const quote = document.createElement('div');
        quote.className = 'said';
        quote.textContent = `„${message}“`;
        el.appendChild(quote);
      }
      return el;
    }

    function next() {
      const alert = queue.shift();
      if (!alert) { showing = false; return; }
      showing = true;

      const [, stay] = WEIGHT[alert.kind] || ['klein', 5000];
      const el = build(alert);
      slot.appendChild(el);
      setTimeout(() => el.classList.add('leaving'), stay - LEAVE_MS);
      setTimeout(() => { el.remove(); next(); }, stay);
    }

    function showAlert(alert) {
      queue.push(alert);
      if (!showing) next();
    }

    const onMessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      switch (event) {
        case 'reward-redeemed':
          showAlert({
            label: 'Kanalpunkte',
            who: data.user_name,
            text: REWARDS[data.reward_type] || 'löst eine Belohnung ein.',
            kind: 'reward',
          });
          break;

        case 'compile-pray':
          showAlert({ label: 'Moment', text: 'Läuft es? Oder stürzt es ab?', kind: 'compile' });
          break;

        case 'roulette-result':
          showAlert({ label: 'Glücksrad', text: data.title, kind: 'compile' });
          break;

        // Follows, subs, gifts, raids and cheers: the server words them
        // (bot/alerts.ts), the overlay only lays them out.
        case 'alert':
          showAlert(data);
          break;
      }
    };

    // Reconnects on its own after a server restart.
    function connect() {
      const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      ws.onmessage = onMessage;
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
