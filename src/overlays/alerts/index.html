<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    .alert-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    /* The Kompendium pattern, as everywhere else: an italic label with its
       stroke, then the line. Right-aligned, so the stroke runs to the left. */
    .alert {
      --art: var(--color-accent);
      text-align: right;
      /* In px, not ch: a ch here counts in the container's small type, not in
         the line's, and the line broke after a third of its room. */
      max-width: 640px;
      animation: alertSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1), alertSlideOut 0.4s ease-in forwards;
      animation-delay: 0s, 4s;
    }

    .alert .alert-kicker { flex-direction: row-reverse; }

    .alert .line {
      font-size: 1.9rem;
      line-height: 1.2;
      margin-top: 8px;
    }

    /* What a viewer wrote along with a sub or cheer — their words, not ours. */
    .alert .said {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--color-secondary);
      margin-top: 6px;
    }

    @keyframes alertSlideIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes alertSlideOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(60px); }
    }
  </style>
</head>
<body>
  <div class="alert-container" id="container"></div>

  <script src="/overlay/boot.js" data-overlay="alerts"></script>
  <script>
    const container = document.getElementById('container');

    // What a redeemed reward did, in the same words as the rest.
    const REWARDS = {
      roulette: 'dreht am Glücksrad.',
      feature_request: 'schlägt etwas vor.',
      change_music: 'wechselt die Musik.',
    };

    function showAlert({ label, who, text, message, kind = '' }) {
      const el = document.createElement('div');
      el.className = 'alert lex lex-fluechtig ' + kind;

      const kicker = document.createElement('div');
      kicker.className = 'lex-kicker alert-kicker';
      kicker.textContent = label;
      el.appendChild(kicker);

      const line = document.createElement('div');
      line.className = 'line';
      if (who) {
        const name = document.createElement('span');
        name.className = 'accent';
        name.textContent = who;
        line.append(name, ` ${text}`);
      } else {
        line.textContent = text;
      }
      el.appendChild(line);

      if (message) {
        const quote = document.createElement('div');
        quote.className = 'said';
        quote.textContent = `„${message}"`;
        el.appendChild(quote);
      }

      container.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    const onMessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      switch (event) {
        case 'reward-redeemed':
          showAlert({
            label: 'Kanalpunkte',
            who: data.user_name,
            text: REWARDS[data.reward_type] || 'löst eine Belohnung ein.',
            kind: 'reward',
          });
          break;

        case 'compile-pray':
          showAlert({ label: 'Moment', text: 'Läuft es? Oder stürzt es ab?', kind: 'compile' });
          break;

        case 'roulette-result':
          showAlert({ label: 'Glücksrad', text: data.title, kind: 'compile' });
          break;

        // Follows, subs, gifts, raids and cheers: the server words them
        // (bot/alerts.ts), the overlay only lays them out.
        case 'alert':
          showAlert(data);
          break;
      }
    };

    // Reconnects on its own after a server restart.
    function connect() {
      const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      ws.onmessage = onMessage;
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
