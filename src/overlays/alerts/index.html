<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    .alert-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .alert {
      font-size: 2.4rem;
      letter-spacing: 0.06em;
      line-height: 1.15;
      text-align: right;
      animation: alertSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1), alertSlideOut 0.4s ease-in forwards;
      animation-delay: 0s, 4s;
    }

    .alert .sub {
      font-family: var(--font-body);
      font-size: 1.1rem;
      font-style: italic;
      letter-spacing: normal;
      color: var(--color-secondary);
      margin-top: 6px;
    }

    /* Each kind sets the accent; the headline itself carries .accent, so one
       value per kind colours it. No kind gets colour rules of its own. */
    .alert.raid { --art: var(--color-accent); }
    .alert.reward { --art: var(--color-secondary); }
    .alert.compile { --art: var(--color-primary); }

    @keyframes alertSlideIn {
      from { opacity: 0; transform: translateX(80px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes alertSlideOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(60px); }
    }
  </style>
</head>
<body>
  <div class="alert-container" id="container"></div>

  <script src="/overlay/boot.js" data-overlay="alerts"></script>
  <script>
    const container = document.getElementById('container');

    const REWARD_LABELS = {
      roulette: '🎰 Glücksrad!',
      feature_request: '💡 Vorschlag!',
      change_music: '🎵 Musik wechseln!',
    };

    function showAlert(title, subtitle, type = '') {
      const el = document.createElement('div');
      el.className = 'alert lex lex-fluechtig ' + type;
      const titleEl = document.createElement('span');
      titleEl.className = 'accent';
      titleEl.textContent = title;
      el.appendChild(titleEl);
      if (subtitle) {
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = subtitle;
        el.appendChild(sub);
      }
      container.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    const onMessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      switch (event) {
        case 'reward-redeemed':
          showAlert(
            REWARD_LABELS[data.reward_type] || '🎁 Reward!',
            `von ${data.user_name}`,
            'reward'
          );
          break;

        case 'compile-pray':
          showAlert('⚡ HYPE MOMENT ⚡', 'Läuft es? Oder crashed es?', 'compile');
          break;

        case 'roulette-result':
          showAlert('🎰 GLÜCKSRAD', `➡️ ${data.title}`, 'compile');
          break;
      }
    };

    // Reconnects on its own after a server restart.
    function connect() {
      const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      ws.onmessage = onMessage;
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
