<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    #container { display: flex; flex-direction: column; gap: 6px; padding: 8px; }

    /* ---- Now Playing ---- */
    .song {
      display: none;
      align-items: center;
      gap: 14px;
    }
    .song.visible { display: flex; animation: songSlideIn 0.5s ease-out; }

    .song-artwork {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
    }
    .song-artwork.visible { display: block; }

    @keyframes songSlideIn {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .now-playing {
      font-family: var(--font-display);
      font-size: 0.733rem;
      letter-spacing: 0;
      color: var(--color-secondary);
      font-style: italic;
      display: inline-block;
      margin-bottom: 2px;
    }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 4px;
      background: var(--art);
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 60%; animation-delay: 0s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.3s; }
    .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.45s; }
    .eq-bar:nth-child(5) { height: 50%; animation-delay: 0.1s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 1.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.867rem;
      color: var(--lex-soft);
    }

    .song-requester {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--lex-faint);
    }

    /* ---- Queue (upcoming songs) ---- */
    .sr-next {
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    .sr-next.visible { display: flex; }

    .sr-next-label {
      font-family: var(--font-display);
      font-size: 0.667rem;
      letter-spacing: 0;
      color: var(--lex-faint);
      font-style: italic;
      margin-bottom: 4px;
    }

    .sr-next-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid var(--lex-rule);
      font-size: 0.867rem;
      color: var(--color-text);
      animation: srFadeIn 0.3s ease-out;
    }
    .sr-next-item:last-child { border-bottom: none; }
    .sr-next-pos { min-width: 16px; color: var(--lex-faint); }
    /* min-width: 0, or a long title refuses to shrink and pushes the row
       past the browser source's width instead of ellipsizing. */
    .sr-next-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-next-user { color: var(--lex-faint); font-size: 0.8rem; font-style: italic; }

    @keyframes srFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Now Playing — shows current song (manual/auto-detect OR song request) -->
    <div class="song lex lex-schlank" id="song">
      <div class="equalizer">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <img class="song-artwork" id="song-artwork" alt="" />
      <div class="song-info">
        <div class="now-playing">Now Playing</div>
        <span class="song-title lex-title" id="song-title"></span>
        <span class="song-artist" id="song-artist"></span>
        <span class="song-requester" id="song-requester"></span>
      </div>
    </div>

    <!-- Queue — upcoming song requests -->
    <div class="sr-next lex lex-schlank" id="next">
      <span class="sr-next-label">Als Nächstes</span>
    </div>
  </div>

  <script src="/overlay/boot.js" data-overlay="song-queue"></script>
  <script>
    const songEl = document.getElementById('song');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');
    const songRequester = document.getElementById('song-requester');
    const songArtwork = document.getElementById('song-artwork');
    const nextEl = document.getElementById('next');

    // --- Now Playing state (can come from song-update OR sr playing) ---
    function showSong(title, artist, requester, artworkUrl) {
      songTitle.textContent = title || 'Unknown';
      songArtist.textContent = artist || '';
      songRequester.textContent = requester || '';
      if (artworkUrl) {
        songArtwork.src = artworkUrl;
        songArtwork.classList.add('visible');
      } else {
        songArtwork.classList.remove('visible');
      }
      songEl.classList.remove('visible');
      void songEl.offsetWidth;
      songEl.classList.add('visible');
    }

    function hideSong() {
      songEl.classList.remove('visible');
      songArtwork.classList.remove('visible');
    }

    // --- Queue rendering ---
    function renderQueue(queue) {
      const playing = queue.find(s => s.status === 'playing');
      const pending = queue.filter(s => s.status === 'pending').slice(0, 3);

      // Show playing song request in the Now Playing section
      if (playing) {
        showSong(playing.title, playing.artist, '@' + playing.requested_by, null);
      }

      // Render upcoming queue
      // Keep the label element, clear only the items
      const label = nextEl.querySelector('.sr-next-label');
      nextEl.innerHTML = '';
      nextEl.appendChild(label);

      if (pending.length > 0) {
        nextEl.classList.add('visible');
        pending.forEach((s, i) => {
          const item = document.createElement('div');
          item.className = 'sr-next-item';
          item.innerHTML =
            '<span class="sr-next-pos">' + (i + 1) + '.</span>' +
            '<span class="sr-next-title">' + escapeHtml(s.title) + (s.artist ? ' — ' + escapeHtml(s.artist) : '') + '</span>' +
            '<span class="sr-next-user">@' + escapeHtml(s.requested_by) + '</span>';
          nextEl.appendChild(item);
        });
      } else {
        nextEl.classList.remove('visible');
      }
    }

    // Titles and names come from viewers' requests — text, never markup.
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // --- Initial fetch for queue ---
    fetch(`${window.__overlayOrigin}/public/song-queue`)
      .then(r => r.json())
      .then(renderQueue)
      .catch(() => {});

    // --- WebSocket ---
    const onMessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      // Manual/auto-detect song update (from SongPanel or SMTC)
      if (event === 'song-update') {
        showSong(data.title, data.artist, '', data.artworkUrl || null);
      }

      if (event === 'song-clear') {
        hideSong();
      }

      // Song request queue update
      if (event === 'sr-update') {
        fetch(`${window.__overlayOrigin}/public/song-queue`)
          .then(r => r.json())
          .then(renderQueue)
          .catch(() => {});
      }
    };

    // Reconnects on its own after a server restart.
    function connect() {
      const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      // Catch up on the queue that changed while the connection was down.
      ws.onopen = () => fetch(`${window.__overlayOrigin}/public/song-queue`).then(r => r.json()).then(renderQueue).catch(() => {});
      ws.onmessage = onMessage;
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
