<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rank Change Alert</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
.alert-container {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 320px;
  width: 90%;
  opacity: 0;
  pointer-events: none;
}

.alert-container.visible {
  opacity: 1;
}

.alert-container.slide-in {
  animation: slideIn 0.5s ease forwards;
}
.alert-container.slide-out {
  animation: slideOut 0.5s ease forwards;
}

@keyframes slideIn {
  from { transform: translate(-50%, -50%) translateX(-60px); opacity: 0; }
  to   { transform: translate(-50%, -50%) translateX(0); opacity: 1; }
}
@keyframes slideOut {
  from { transform: translate(-50%, -50%) translateX(0); opacity: 1; }
  to   { transform: translate(-50%, -50%) translateX(60px); opacity: 0; }
}

.alert-header {
  font-family: var(--font-display);
  font-size: 0.867rem;
  font-style: italic;
  letter-spacing: 0;
  color: var(--color-secondary);
  text-align: center;
  margin-bottom: 12px;
}

.alert-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
}

/* No panels: this sits on screen for five seconds, and a row of boxes
   fading in pulls the eye off the names. */
.alert-entry {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 2px;
  position: relative;
  transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
}

.alert-entry.entered {
  animation: enterSlide 0.5s ease 0.8s both;
}

@keyframes enterSlide {
  from { transform: translateX(-40px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}

.alert-entry.exiting {
  animation: exitSlide 0.5s ease both;
}

@keyframes exitSlide {
  from { transform: translateX(0); opacity: 1; }
  to   { transform: translateX(40px); opacity: 0; }
}

.rank {
  font-family: var(--font-display);
  font-size: 1.467rem;
  color: var(--lex-faint);
  min-width: 34px;
  text-align: right;
}
.alert-entry.rank-1 .rank { color: var(--color-accent); }
.alert-entry.rank-2 .rank { color: var(--color-secondary); }
.alert-entry.rank-3 .rank { color: var(--lex-soft); }

.name {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 1.267rem;
  color: var(--color-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.count {
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: var(--color-secondary);
}

/* The direction mark carries the accent, the rest stays type. */
.badge {
  font-size: 0.867rem;
  letter-spacing: 0.1em;
  color: var(--art);
}
.badge.down { color: var(--lex-faint); }
.badge.new {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 0.8rem;
  color: var(--color-secondary);
}
</style>
</head>
<body>
<div class="alert-container lex lex-fluechtig" id="alertContainer">
  <div class="alert-header">Platzwechsel!</div>
  <div class="alert-list" id="alertList"></div>
</div>

<script src="/overlay/boot.js" data-overlay="reward-rankchange"></script>
<script>
const params = new URLSearchParams(window.location.search);
const configuredType = params.get('type') || 'all';

const queue = [];
let animating = false;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function handleLeaderboardUpdate(data) {
  if (data.type !== configuredType) return;
  if ((!data.changes || data.changes.length === 0) && (!data.entered || data.entered.length === 0)) return;
  queue.push(data);
  processQueue();
}

async function processQueue() {
  if (animating || queue.length === 0) return;
  animating = true;

  const data = queue.shift();
  await playAnimation(data);

  animating = false;
  processQueue();
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playAnimation(data) {
  const container = document.getElementById('alertContainer');
  const list = document.getElementById('alertList');
  list.innerHTML = '';

  const changedUsers = new Set((data.changes || []).map(c => c.userName));
  const enteredUsers = new Set((data.entered || []).map(e => e.userName));

  for (const entry of data.leaderboard) {
    const el = document.createElement('div');
    const isChanged = changedUsers.has(entry.userName);
    const isEntered = enteredUsers.has(entry.userName);

    let classes = `alert-entry rank-${entry.rank}`;
    if (isChanged) classes += ' changed';
    if (isEntered) classes += ' entered';
    el.className = classes;

    let badge = '';
    if (isEntered) {
      badge = '<span class="badge new">Neu</span>';
    } else if (isChanged) {
      const change = data.changes.find(c => c.userName === entry.userName);
      if (change) {
        const arrow = change.changeType === 'up' ? '▲' : '▼';
        badge = `<span class="badge ${change.changeType}">${arrow}</span>`;
      }
    }

    el.innerHTML = `
      <span class="rank">#${entry.rank}</span>
      <span class="name">${escapeHtml(entry.userName)}</span>
      ${badge}
      <span class="count">${entry.count}</span>
    `;
    list.appendChild(el);
  }

  // Slide in
  container.classList.remove('slide-out');
  container.classList.add('visible', 'slide-in');

  // Hold
  await sleep(5500);

  // Slide out
  container.classList.remove('slide-in');
  container.classList.add('slide-out');
  await sleep(500);

  // Reset
  container.classList.remove('visible', 'slide-out');
  list.innerHTML = '';
}

// WebSocket
function connectWS() {
  const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

  ws.onopen = () => {
    console.log('[RankChange] WebSocket connected');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'reward-leaderboard-update') handleLeaderboardUpdate(msg.data);
      if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);
    } catch {}
  };

  ws.onclose = () => {
    console.log('[RankChange] WebSocket closed, reconnecting...');
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => ws.close();
}

connectWS();
</script>
</body>
</html>
