<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    .banner {
      display: none;
      align-items: center;
      gap: 14px;
    }

    .banner.visible { display: flex; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--lex-faint);
    }

    .status-dot.in_progress {
      background: var(--art);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .status-dot.done { background: var(--art); }
    .status-dot.failed { background: var(--color-secondary); }
    .status-dot.idle { background: var(--lex-faint); }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .title { font-size: 1.333rem; }

    .status-label {
      font-family: var(--font-display);
      font-size: 0.867rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--art);
    }

    /* Monospace on purpose: a proportional serif makes the digits jump
       about as the seconds tick. */
    .timer {
      font-family: ui-monospace, monospace;
      font-size: 1.267rem;
      color: var(--color-primary);
      margin-left: auto;
      letter-spacing: 0.05em;
    }

    .timer.paused { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="banner lex lex-schlank" id="banner">
    <div class="status-dot" id="dot"></div>
    <span class="title lex-title" id="title"></span>
    <span class="status-label" id="status-label"></span>
    <span class="timer" id="timer"></span>
  </div>

  <script src="/overlay/boot.js" data-overlay="challenge"></script>
  <script>
    var banner = document.getElementById('banner');
    var dot = document.getElementById('dot');
    var titleEl = document.getElementById('title');
    var statusLabel = document.getElementById('status-label');
    var timerEl = document.getElementById('timer');

    var currentSeconds = 0;
    var timerRunning = false;
    var tickInterval = null;

    function formatTime(s) {
      var m = Math.floor(s / 60).toString().padStart(2, '0');
      var sec = (s % 60).toString().padStart(2, '0');
      return m + ':' + sec;
    }

    function startTicking() {
      stopTicking();
      if (!timerRunning) return;
      tickInterval = setInterval(function() {
        currentSeconds++;
        timerEl.textContent = formatTime(currentSeconds);
      }, 1000);
    }

    function stopTicking() {
      if (tickInterval) {
        clearInterval(tickInterval);
        tickInterval = null;
      }
    }

    var statusMap = {
      'in_progress': 'Läuft',
      'done': 'Geschafft!',
      'failed': 'Nicht geschafft',
      'idle': ''
    };

    function update(state) {
      if (!state.challenge_title || state.challenge_status === 'idle') {
        banner.classList.remove('visible');
        stopTicking();
        return;
      }

      banner.classList.add('visible');
      titleEl.textContent = state.challenge_title;
      statusLabel.textContent = statusMap[state.challenge_status] || state.challenge_status;
      dot.className = 'status-dot ' + state.challenge_status;

      currentSeconds = state.timer_seconds || 0;
      timerRunning = !!state.timer_running;

      if (currentSeconds > 0 || timerRunning) {
        timerEl.textContent = formatTime(currentSeconds);
        timerEl.style.display = '';
      } else {
        timerEl.style.display = 'none';
      }

      if (timerRunning) {
        timerEl.classList.remove('paused');
        startTicking();
      } else {
        timerEl.classList.add('paused');
        stopTicking();
      }
    }

    // WebSocket
    var ws;
    function connectWS() {
      ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

      ws.onopen = function() {
        fetch(`${window.__overlayOrigin}/public/stream-state`)
          .then(function(r) { return r.json(); })
          .then(update);
      };

      ws.onmessage = function(msg) {
        try {
          var parsed = JSON.parse(msg.data);
          if (parsed.event === 'stream-state') update(parsed.data);
          if (parsed.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(parsed.data);
        } catch(e) {}
      };

      ws.onclose = function() {
        stopTicking();
        setTimeout(connectWS, 2000);
      };

      ws.onerror = function() { ws.close(); };
    }

    connectWS();
  </script>
</body>
</html>
