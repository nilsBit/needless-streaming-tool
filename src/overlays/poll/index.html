<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    body { max-width: 100vw; overflow-x: hidden; }

    .poll {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
    }

    .poll.visible { display: flex; }

    .poll-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
    }

    #options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .poll-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--lex-rule);
    }

    .poll-label {
      font-family: var(--font-body);
      font-size: 14px;
      color: #ffffff;
      flex: 1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .poll-count {
      font-family: var(--font-display);
      font-size: 20px;
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* The vote share, filled behind the label and count. */
    .poll-bar {
      position: absolute;
      inset: 0;
      width: 0%;
      background: var(--art);
      opacity: 0.25;
      z-index: -1;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .poll-option.winner .poll-label {
      color: #ffffff;
    }

    .poll-option.winner .poll-count {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="poll lex lex-schlank" id="poll">
    <div class="poll-title" id="poll-title"></div>
    <div id="options"></div>
  </div>

  <script src="/overlay/boot.js" data-overlay="poll"></script>
  <script>
    const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
    const poll = document.getElementById('poll');
    const pollTitle = document.getElementById('poll-title');
    const optionsEl = document.getElementById('options');

    ws.onmessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);

      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);

      if (event === 'poll-update') {
        poll.classList.add('visible');
        pollTitle.textContent = data.title;

        const total = data.options.reduce((sum, o) => sum + o.votes, 0) || 1;

        optionsEl.innerHTML = '';
        data.options.forEach(o => {
          const opt = document.createElement('div');
          opt.className = 'poll-option';
          const bar = document.createElement('div');
          bar.className = 'poll-bar';
          bar.style.width = ((o.votes / total) * 100) + '%';
          const label = document.createElement('span');
          label.className = 'poll-label';
          label.textContent = o.label;
          const count = document.createElement('span');
          count.className = 'poll-count';
          count.textContent = String(o.votes);
          opt.appendChild(bar);
          opt.appendChild(label);
          opt.appendChild(count);
          optionsEl.appendChild(opt);
        });
      }

      if (event === 'poll-close') {
        // Highlight the winner
        const options = optionsEl.querySelectorAll('.poll-option');
        let maxVotes = -1;
        let winnerEl = null;
        options.forEach(opt => {
          const count = parseInt(opt.querySelector('.poll-count').textContent) || 0;
          if (count > maxVotes) {
            maxVotes = count;
            winnerEl = opt;
          }
        });
        if (winnerEl) winnerEl.classList.add('winner');

        setTimeout(() => poll.classList.remove('visible'), 5000);
      }
    };
  </script>
</body>
</html>
