<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #ffffff;
      --color-secondary: #cccccc;
      --color-accent: #ffffff;
      --color-bg: #0a0a0a;
      --font-display: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent !important; background-color: rgba(0,0,0,0) !important; font-family: var(--font-body); overflow: hidden; }

    .character {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 14px 22px 14px 14px;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid var(--color-accent);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      max-width: 460px;
    }
    .character.visible { display: flex; animation: charIn 0.5s ease-out; }

    @keyframes charIn {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .character-portrait {
      width: 64px;
      height: 64px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      display: none;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .character-portrait.visible { display: block; }

    .character-body { min-width: 0; }

    .character-label {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-accent);
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .character-name {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--color-primary);
    }

    .character-role {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-secondary);
      margin-top: 1px;
    }

    .character-summary {
      font-size: 13px;
      line-height: 1.4;
      color: var(--color-secondary);
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .character-summary:empty { display: none; }
  </style>
  <script>
(function() {
  var name = 'character';
  var origin = window.location.origin || 'http://localhost:4000';
  window.__overlayOrigin = origin;
  window.__overlayWs = origin.replace(/^http/, 'ws');
  document.documentElement.style.visibility = 'hidden';
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return r + ' ' + g + ' ' + b;
  }
  fetch(origin + '/public/overlay-config')
    .then(function(r) { return r.json(); })
    .then(function(config) {
      var vars = Object.assign({}, config.global || {}, (config.overrides || {})[name] || {});
      var root = document.documentElement;
      Object.keys(vars).forEach(function(k) { root.style.setProperty(k, vars[k]); });
      ['--color-primary', '--color-secondary', '--color-accent', '--color-bg'].forEach(function(k) {
        if (vars[k]) root.style.setProperty(k + '-rgb', hexToRgb(vars[k]));
      });
      var fonts = [vars['--font-display'], vars['--font-body']].filter(Boolean);
      if (fonts.length > 0) {
        var families = fonts.map(function(f) { return f.split(',')[0].replace(/'/g, '').trim(); });
        var link = document.createElement('link');
        link.href = 'https://fonts.googleapis.com/css2?family=' + families.map(function(f) { return encodeURIComponent(f) + ':wght@400;600;700'; }).join('&') + '&display=swap';
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }
    })
    .catch(function() {})
    .finally(function() { document.documentElement.style.visibility = 'visible'; });
  window.__applyOverlayConfig = function(config) {
    var vars = Object.assign({}, config.global || {}, (config.overrides || {})[name] || {});
    var root = document.documentElement;
    Object.keys(vars).forEach(function(k) { root.style.setProperty(k, vars[k]); });
    ['--color-primary', '--color-secondary', '--color-accent', '--color-bg'].forEach(function(k) {
      if (vars[k]) root.style.setProperty(k + '-rgb', hexToRgb(vars[k]));
    });
  };
})();
  </script>
</head>
<body>
  <div class="character" id="character">
    <img class="character-portrait" id="character-portrait" alt="">
    <div class="character-body">
      <div class="character-label">Gerade in Arbeit</div>
      <div class="character-name" id="character-name"></div>
      <div class="character-role" id="character-role"></div>
      <div class="character-summary" id="character-summary"></div>
    </div>
  </div>

  <script>
    const card = document.getElementById('character');
    const portrait = document.getElementById('character-portrait');
    const nameEl = document.getElementById('character-name');
    const roleEl = document.getElementById('character-role');
    const summaryEl = document.getElementById('character-summary');

    function render(character) {
      if (!character) {
        card.classList.remove('visible');
        return;
      }
      nameEl.textContent = character.name || '';
      roleEl.textContent = character.role || '';
      summaryEl.textContent = character.summary || '';
      if (character.image) {
        portrait.src = character.image;
        portrait.classList.add('visible');
      } else {
        portrait.removeAttribute('src');
        portrait.classList.remove('visible');
      }
      card.classList.add('visible');
    }

    // Show whatever is pinned right now, so a reload mid-stream is seamless.
    fetch(window.__overlayOrigin + '/public/character')
      .then(function(r) { return r.json(); })
      .then(function(d) { render(d.character); })
      .catch(function() {});

    const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
    ws.onmessage = (msg) => {
      const { event, data } = JSON.parse(msg.data);
      if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);
      if (event === 'character-changed') render(data);
    };
  </script>
</body>
</html>
