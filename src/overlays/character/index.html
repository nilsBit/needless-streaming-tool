<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    /*
     * The Entry Card in the "Lexikon" style (#19): whatever is being worked on
     * right now, as a page out of the world's lexicon.
     *
     * Colors, fonts and the derived tones come from /overlay/lexikon.css and
     * the settings panel. Only what is this overlay's own sits here.
     */
    :root {
      /* Never wider than its browser source — a card cut off at the right edge
         loses its seal and its maturity line. */
      --lex-width: min(720px, 100%);
      --lex-kicker: 'Lexikon';
    }

    .slot {
      position: absolute;
      top: var(--lex-margin);
      left: var(--lex-margin);
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity .5s ease, transform .6s cubic-bezier(.2, .8, .2, 1);
    }
    .slot.in { opacity: 1; transform: none; transition-delay: .15s; }
    .slot.out { opacity: 0; transform: translateY(10px); transition-delay: 0s; }

    /* Frame, background and seal come from .lex-voll and .lex-seal. */
    .card { width: var(--lex-width); }

    .seal svg { width: 34px; height: 34px; }
    .seal.portrait { width: 104px; height: 104px; border: 2px solid var(--art); }
    .seal img { width: 100%; height: 100%; object-fit: cover; }

    .kicker { padding-right: 90px; }
    .kicker::before { content: var(--lex-kicker); }
    .kicker .art { color: var(--art); }

    /* Two lines at most. A longer title gets smaller type (see fitTitle), and
       what still doesn't fit is cut — the card must stay inside its source. */
    .title {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      margin-top: 14px;
      padding-right: 60px;
      font-size: 4rem;
    }
    /* More specific than a Figma override on div.title.lex-title (tag + two
       classes), so a long title still shrinks after the size was changed there. */
    .card .title.long { font-size: 3rem; }
    .has-portrait .kicker, .has-portrait .title { padding-right: 130px; }
    .alias {
      margin-top: 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: italic 500 1.733rem var(--font-display);
      color: var(--lex-soft);
    }

    .body {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
      margin-top: 18px;
      font: 400 1.467rem/1.55 var(--font-body);
    }
    .body:not(.empty)::first-letter { float: left; padding: 8px 10px 0 0; font: 600 5.067rem/.8 var(--font-display); color: var(--art); }
    .body.empty { font-style: italic; color: var(--lex-faint); }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 18px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--lex-rule);
      font: 400 1.2rem/1.45 var(--font-body);
    }
    dt { font: italic 600 1.2rem var(--font-body); color: var(--color-secondary); }
    dd { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }

    .foot { display: flex; justify-content: space-between; gap: 24px; margin-top: 16px; font: italic 1.067rem var(--font-body); color: var(--lex-faint); }
  </style>
</head>
<body>
  <script src="/overlay/boot.js" data-overlay="character"></script>
  <script>
    /**
     * Facts and relationships together, one line each. More would push the
     * card out of its 800×700 source. Relationships come after the facts, and
     * one always gets a place when the entry has any.
     */
    const MAX_ROWS = 3;

    // A glyph for the Arten a world usually has; any other Art gets initials.
    const BOOK = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M6 10 C14 8 20 9 24 13 C28 9 34 8 42 10 V38 C34 36 28 37 24 41 C20 37 14 36 6 38 Z"/><path d="M24 13 V41"/></svg>';
    const MOUNTAIN = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M4 38 L18 16 L26 28 L32 20 L44 38 Z"/><circle cx="35" cy="10" r="4"/></svg>';
    const BANNER = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M12 5 V43"/><path d="M12 8 H38 L32 17 L38 26 H12"/></svg>';
    const GLYPHS = { region: MOUNTAIN, ort: MOUNTAIN, gilde: BANNER, fraktion: BANNER, begriff: BOOK, konzept: BOOK };

    const stage = document.body;
    const esc = (value) => String(value).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function initials(title) {
      const words = title
        .replace(/„[^“]*“/g, ' ')
        .replace(/\b(Die|Der|Das|und)\b|Dr\./g, ' ')
        .split(/\s+/)
        .filter(Boolean);
      if (words.length === 0) return '?';
      return (words.length > 1 ? words[0][0] + words[words.length - 1][0] : words[0][0]).toUpperCase();
    }

    function seal(card) {
      if (card.image) return `<div class="seal lex-seal portrait"><img src="${esc(card.image)}" alt=""></div>`;
      return `<div class="seal lex-seal">${GLYPHS[card.art.toLowerCase()] || esc(initials(card.title))}</div>`;
    }

    /** Relationships read like facts ("Gehört zu"), capitalised the way a lexicon would. */
    const capitalise = (label) => label.charAt(0).toUpperCase() + label.slice(1);

    function render(card) {
      const relations = (card.relations || []).map((r) => ({ name: capitalise(r.name), value: r.value }));
      const facts = [...card.facts.slice(0, MAX_ROWS - Math.min(relations.length, 1)), ...relations].slice(0, MAX_ROWS);
      const maturity = card.maturity ? `Stand: ${card.maturity}` : '';
      return `<div class="card lex lex-voll${card.image ? ' has-portrait' : ''}">
        ${seal(card)}
        <div class="kicker lex-kicker"><span class="art">${esc(card.art)}</span></div>
        <div class="title lex-title">${esc(card.title)}</div>
        ${card.aliasLine ? `<div class="alias">${esc(card.aliasLine)}</div>` : ''}
        <p class="body${card.body ? '' : ' empty'}">${card.body ? esc(card.body) : 'Dieses Blatt ist noch leer.'}</p>
        ${facts.length ? `<dl>${facts.map((f) => `<dt>${esc(f.name)}</dt><dd>${esc(f.value)}</dd>`).join('')}</dl>` : ''}
        ${card.world || maturity ? `<div class="foot"><span>${esc(card.world || '')}</span><span>${esc(maturity)}</span></div>` : ''}
      </div>`;
    }

    let current = null;

    /** A title that runs past two lines at full size gets the smaller size. */
    function fitTitle(slot) {
      const title = slot.querySelector('.title');
      if (!title) return;
      title.classList.remove('long');
      const lines = Math.round(title.scrollHeight / parseFloat(getComputedStyle(title).lineHeight));
      if (lines > 2) title.classList.add('long');
    }

    // Measured in the fallback font until the real one arrives. boot.js adds
    // the web fonts only once the config is in, after this runs — so wait for
    // each finished load, not for a `ready` that has nothing to wait on yet.
    document.fonts.addEventListener('loadingdone', () => {
      if (current) fitTitle(current);
    });

    /**
     * Shows a card, crossfading from the one before. The same entry again —
     * a field switched off mid-stream — changes in place, without a flash.
     */
    function show(card) {
      if (card && current && current.dataset.id === card.id) {
        current.style.setProperty('--art', card.artColor || 'var(--color-accent)');
        current.innerHTML = render(card);
        fitTitle(current);
        return;
      }

      const old = current;
      if (old) {
        old.classList.remove('in');
        old.classList.add('out');
        setTimeout(() => old.remove(), 700);
      }
      current = null;
      if (!card) return;

      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.id = card.id;
      if (card.artColor) slot.style.setProperty('--art', card.artColor);
      slot.innerHTML = render(card);
      stage.appendChild(slot);
      fitTitle(slot);
      requestAnimationFrame(() => requestAnimationFrame(() => slot.classList.add('in')));
      current = slot;
    }

    const origin = window.__overlayOrigin;

    function load() {
      fetch(origin + '/public/entry')
        .then((r) => r.json())
        .then((d) => show(d.card))
        .catch(() => {});
    }

    // Reconnects on its own, and catches up on whatever changed meanwhile.
    function connect() {
      const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      ws.onopen = load;
      ws.onmessage = (msg) => {
        try {
          const { event, data } = JSON.parse(msg.data);
          if (event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(data);
          if (event === 'entry-changed') show(data);
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }

    load();
    connect();
  </script>
</body>
</html>
