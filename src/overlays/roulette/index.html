<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Glücksrad - OBS Overlay</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
  /* The wheel is a reel: the list rolls through a window and stops on the
     draw. Drawn for the 704 px square it has in the scene "main" — one --u is
     one of those pixels, so everything grows with the browser source. */
  :root { --u: calc(100vmin / 704); }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    width: calc(620 * var(--u));
    padding: calc(26 * var(--u)) calc(30 * var(--u)) calc(24 * var(--u));
    background: color-mix(in srgb, var(--color-bg) calc(var(--color-bg-opacity) * 100%), transparent);
    color: var(--color-text);
    font-family: var(--font-body);
    opacity: 0;
    transform: translateY(calc(12 * var(--u)));
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .panel.visible { opacity: 1; transform: none; }
  .panel.hiding { opacity: 0; transition: opacity 0.8s ease; }

  /* Kicker: the wheel's name in the accent, a line, how many are on it. */
  .kicker {
    display: flex;
    align-items: center;
    gap: calc(14 * var(--u));
    font: italic 400 calc(15 * var(--u)) var(--font-display);
  }
  .kicker .what { color: var(--color-accent); }
  .kicker .line { flex: 1; height: 1px; background: var(--lex-kicker-line); }
  .kicker .count { color: var(--lex-faint); }

  /* Five rows show; the middle one is where the reel stops. */
  .window {
    --row: calc(64 * var(--u));
    position: relative;
    height: calc(5 * var(--row));
    margin-top: calc(18 * var(--u));
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /* will-change only while spinning (spin()): a layer kept for good costs OBS even while hidden. */
  }
  .row {
    height: var(--row);
    display: flex;
    align-items: center;
    padding: 0 calc(22 * var(--u)) 0 calc(46 * var(--u));
    border-bottom: 1px solid var(--lex-rule);
    font-size: calc(22 * var(--u));
    color: var(--lex-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.won {
    background: var(--color-accent);
    color: var(--color-primary);
    font-weight: 700;
  }
  .mark {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(2 * var(--row));
    height: var(--row);
    border-top: 1px solid var(--color-accent);
    border-bottom: 1px solid var(--color-accent);
    pointer-events: none;
  }
  .mark::before {
    content: '';
    position: absolute;
    left: calc(14 * var(--u));
    top: 50%;
    transform: translateY(-50%);
    border-top: calc(11 * var(--u)) solid transparent;
    border-bottom: calc(11 * var(--u)) solid transparent;
    border-left: calc(18 * var(--u)) solid var(--color-accent);
  }

  .foot {
    margin-top: calc(16 * var(--u));
    min-height: calc(22 * var(--u));
    font: italic 400 calc(15 * var(--u)) var(--font-body);
    color: var(--lex-faint);
  }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="kicker">
    <span class="what" id="rouletteTitle">Glücksrad</span>
    <span class="line"></span>
    <span class="count" id="count"></span>
  </div>
  <div class="window">
    <div class="band" id="band"></div>
    <div class="mark"></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script src="/overlay/boot.js" data-overlay="roulette"></script>
<script>
// How often the list repeats on the band. The reel runs over most of it, so
// even two topics roll long enough to look like a draw.
const LAPS = 14;
// Matches WHEEL_SPIN_MS in src/server/api/actions.ts — the server holds
// roulette-result back that long, so the alert does not give the winner away.
const SPIN_MS = 5000;
const RESULT_DISPLAY_MS = 6000;
const HINT = 'Der Chat wirft Themen ein mit !themen';

let topics = [];
let position = 0;      // index on the band that sits in the middle row
let spinning = false;
let hideTimeout = null;
const panel = document.getElementById('panel');
const band = document.getElementById('band');

function showOverlay() {
  if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
  panel.classList.remove('hiding');
  panel.classList.add('visible');
}

function hideOverlay() {
  panel.classList.add('hiding');
  panel.classList.remove('visible');
  setTimeout(() => panel.classList.remove('hiding'), 800);
}

function rowHeight() {
  return band.firstElementChild ? band.firstElementChild.getBoundingClientRect().height : 0;
}

// Row `index` of the band in the middle of the window (the third of five).
function place(index) {
  band.style.transform = `translateY(${(2 - index) * rowHeight()}px)`;
}

// Titles are issue titles — text, never markup.
function setTopics(list) {
  topics = list.length ? list : [{ id: 0, title: 'Keine offenen Themen' }];
  band.textContent = '';
  for (let k = 0; k < topics.length * LAPS; k++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = topics[k % topics.length].title;
    band.appendChild(row);
  }
  position = topics.length;
  place(position);
  document.getElementById('count').textContent =
    list.length === 1 ? '1 Thema' : `${list.length} Themen`;
}

// The streamer's name for the wheel (Glücksrad panel in the app).
function setTitle(title) {
  document.getElementById('rouletteTitle').textContent = title || 'Glücksrad';
}
async function loadTitle() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/roulette`);
    setTitle((await res.json()).title);
  } catch {}
}

async function loadIssues() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/issues`);
    const issues = await res.json();
    setTopics(issues.filter((i) => i.status === 'open'));
  } catch (err) {
    console.error('[Roulette] Failed to load issues:', err);
  }
}

function spin(winnerId) {
  if (spinning || !topics.length) return;
  spinning = true;
  band.style.willChange = 'transform';
  showOverlay();
  band.querySelectorAll('.won').forEach((r) => r.classList.remove('won'));
  document.getElementById('foot').textContent = HINT;

  const n = topics.length;
  let winner = topics.findIndex((t) => t.id === winnerId);
  if (winner < 0) winner = Math.floor(Math.random() * n);

  // Start one lap in, end three laps before the band runs out — on the winner.
  const from = (position % n) + n;
  const to = n * (LAPS - 3) + winner;
  const t0 = performance.now();

  function frame(now) {
    const p = Math.min((now - t0) / SPIN_MS, 1);
    const eased = 1 - Math.pow(1 - p, 4);
    place(from + (to - from) * eased);
    if (p < 1) { requestAnimationFrame(frame); return; }

    position = to;
    place(to);
    band.children[to].classList.add('won');
    document.getElementById('foot').textContent = 'Als Nächstes dran';
    spinning = false;
    band.style.willChange = '';
    hideTimeout = setTimeout(hideOverlay, RESULT_DISPLAY_MS);
  }
  requestAnimationFrame(frame);
}

const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

ws.onmessage = (e) => {
  try {
    const msg = JSON.parse(e.data);

    if (msg.event === 'overlay-config' && window.__applyOverlayConfig) {
      window.__applyOverlayConfig(msg.data);
      if (!spinning) place(position);
    }

    if (msg.event === 'roulette-config') setTitle(msg.data.title);

    if (msg.event === 'issue-created' || msg.event === 'issue-updated' || msg.event === 'issue-deleted') {
      if (!spinning) loadIssues();
    }

    // The draw carries the list it drew from. Ours may be older — or empty,
    // which is what a preview without open issues used to spin over.
    if (msg.event === 'roulette-spin' && !spinning) {
      if (Array.isArray(msg.data.issues) && msg.data.issues.length) setTopics(msg.data.issues);
      spin(msg.data.winner_id);
    }
  } catch {}
};

ws.onclose = () => setTimeout(() => location.reload(), 3000);

// A source resized in OBS changes the row height; keep the middle row in place.
window.addEventListener('resize', () => { if (!spinning) place(position); });

loadIssues();
loadTitle();
</script>
</body>
</html>
