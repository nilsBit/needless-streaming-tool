<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lucky Spin - OBS Overlay</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 100vh;
    padding: 8px;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .container.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .container.hiding {
    opacity: 0;
    transform: scale(0.8) translateY(-20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .counter {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 14px;
    flex-shrink: 0;
  }

  .counter .diamond {
    color: var(--art);
    font-size: 14px;
    animation: orbFloat 2s ease-in-out infinite;
  }

  .counter .pts {
    color: var(--color-primary);
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.1em;
  }

  .counter .label {
    color: var(--lex-faint);
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }

  .wheel-wrapper {
    position: relative;
    flex: 1;
    min-height: 0;
    aspect-ratio: 1;
    max-width: 90vw;
  }

  .wheel-rotate {
    width: 100%;
    height: 100%;
  }
  .wheel-rotate svg {
    width: 100%;
    height: 100%;
  }

  .orb { display: none; }

  .pointer-wrap {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
  }

  .result {
    padding: 8px 16px;
    text-align: center;
    flex-shrink: 0;
    animation: fadeIn 0.4s ease-out forwards;
  }

  .result-label {
    color: var(--color-secondary);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.28em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .result-value {
    font-family: var(--font-display);
    font-size: 1.6rem;
    color: var(--color-primary);
  }

  .result-sub {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 12px;
    color: var(--color-secondary);
    margin-top: 4px;
  }

  .hidden { display: none; }

  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes orbFloat {
    0% { transform: translateY(0); opacity: .4; }
    50% { transform: translateY(-4px); opacity: .8; }
    100% { transform: translateY(0); opacity: .4; }
  }
</style>
</head>
<body>

<div class="container lex lex-fluechtig">
  <div class="counter">
    <span class="diamond">&#9670;</span>
    <span class="pts" id="totalPts">0</span>
    <span class="label">PTS</span>
  </div>

  <div class="wheel-wrapper">
    <div id="orbs"></div>

    <div class="pointer-wrap" id="pointer">
      <svg width="28" height="40" viewBox="0 0 14 20">
        <polygon points="7,0 14,18 0,18" style="fill:var(--color-primary);stroke:var(--color-bg)" stroke-width="1"/>
        <polygon points="7,3 11,16 3,16" style="fill:var(--art)"/>
      </svg>
    </div>

    <div class="wheel-rotate" id="wheel"></div>
  </div>

  <div class="result hidden" id="resultBox">
    <div class="result-label">Ergebnis</div>
    <div class="result-value" id="resultValue"></div>
    <div class="result-sub" id="resultSub"></div>
  </div>
</div>

<script src="/overlay/boot.js" data-overlay="roulette"></script>
<script>
// Two alternating grounds from the palette, so the wheel follows the settings
// panel like everything else. SVG presentation attributes do not take var(),
// hence the style attributes further down.
const PALETTE = [
  { bg: 'var(--color-bg)', txt: 'var(--lex-faint)' },
  { bg: 'var(--color-bg-secondary)', txt: 'var(--lex-soft)' },
];

let SEGMENTS = [];
let N, ANG;
const R=140, CX=160, CY=160;
let rotation=0, spinning=false, total=0;
let pendingWinnerId = null;
let hideTimeout = null;
const RESULT_DISPLAY_MS = 6000; // Show result for 6 seconds then hide
const container = () => document.querySelector('.container');

function showOverlay() {
  if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
  const el = container();
  el.classList.remove('hiding');
  el.classList.add('visible');
}

function hideOverlay() {
  const el = container();
  el.classList.add('hiding');
  el.classList.remove('visible');
  setTimeout(() => {
    el.classList.remove('hiding');
    document.getElementById('resultBox').classList.add('hidden');
  }, 800);
}

// Fetch issues from API and build segments
async function loadIssues() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/issues`);
    const issues = await res.json();
    const openIssues = issues.filter(b => b.status === 'open');

    if (openIssues.length === 0) {
      SEGMENTS = [{ id: 0, label: "Keine Issues", bg: 'var(--color-bg)', txt: 'var(--lex-faint)', title: "Keine offenen Issues" }];
    } else {
      SEGMENTS = openIssues.map((issue, i) => {
        const style = PALETTE[i % PALETTE.length];
        // Truncate long titles for the wheel
        const label = issue.title.length > 12 ? issue.title.substring(0, 11) + '…' : issue.title;
        return { id: issue.id, label, bg: style.bg, txt: style.txt, title: issue.title };
      });
    }

    N = SEGMENTS.length;
    ANG = 360 / N;
    buildWheel();
    buildOrbs();
  } catch (err) {
    console.error('[Roulette] Failed to load issues:', err);
  }
}

// WebSocket for live updates
const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

ws.onmessage = (e) => {
  try {
    const msg = JSON.parse(e.data);

    if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);

    // Issues changed — rebuild wheel
    if (msg.event === 'issue-created' || msg.event === 'issue-updated' || msg.event === 'issue-deleted') {
      if (!spinning) loadIssues();
    }

    // Roulette triggered from dashboard/API — auto-spin to winner
    if (msg.event === 'roulette-spin' && !spinning) {
      pendingWinnerId = msg.data.winner_id;
      spin();
    }
  } catch {}
};

ws.onclose = () => setTimeout(() => location.reload(), 3000);

function p2c(cx,cy,r,d){const a=(d-90)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function ap(cx,cy,r,s,e){const sp=p2c(cx,cy,r,s),ep=p2c(cx,cy,r,e);return`M${cx},${cy} L${sp.x},${sp.y} A${r},${r} 0 ${e-s>180?1:0} 1 ${ep.x},${ep.y} Z`;}

function buildWheel(){
  if (!SEGMENTS.length) return;

  const fontSize = N <= 6 ? 10 : N <= 10 ? 9 : 7;
  const labelRadius = N <= 6 ? R*0.58 : R*0.62;

  let segs='';
  SEGMENTS.forEach((s,i)=>{
    const sd=i*ANG,ed=(i+1)*ANG,md=sd+ANG/2,lp=p2c(CX,CY,labelRadius,md);
    // Flat segment fill
    segs+=`<path d="${ap(CX,CY,R,sd,ed)}" style="fill:${s.bg}"/>`;
    // Segment divider
    segs+=`<path d="${ap(CX,CY,R,sd,ed)}" style="fill:none;stroke:var(--lex-rule)" stroke-width="1"/>`;
    // Label
    segs+=`<g transform="translate(${lp.x},${lp.y}) rotate(${md})"><text text-anchor="middle" dominant-baseline="central" style="fill:${s.txt};font-family:var(--font-body)" font-size="${fontSize}">${s.label}</text></g>`;
  });

  document.getElementById('wheel').innerHTML=`<svg width="320" height="320" viewBox="0 0 320 320">${segs}<circle cx="${CX}" cy="${CY}" r="${R}" style="fill:none;stroke:var(--lex-frame)" stroke-width="1"/><circle cx="${CX}" cy="${CY}" r="18" style="fill:var(--color-bg);stroke:var(--lex-frame)" stroke-width="1"/><circle cx="${CX}" cy="${CY}" r="4" style="fill:var(--art)"/></svg>`;

  document.getElementById('totalPts').textContent = N + ' ISSUES';
}

function buildOrbs(){
  document.getElementById('orbs').innerHTML='';
}

function spin(){
  if(spinning || !SEGMENTS.length) return;
  spinning=true;
  showOverlay();
  document.getElementById('resultBox').classList.add('hidden');
  document.getElementById('pointer').classList.add('active');

  // If we have a predetermined winner from the API, calculate target angle
  let targetAngle;
  if (pendingWinnerId !== null) {
    const winnerIdx = SEGMENTS.findIndex(s => s.id === pendingWinnerId);
    if (winnerIdx >= 0) {
      // Land in the middle of the winner segment
      targetAngle = 360 - (winnerIdx * ANG + ANG / 2);
    } else {
      targetAngle = Math.random() * 360;
    }
    pendingWinnerId = null;
  } else {
    targetAngle = Math.random() * 360;
  }

  const spins = 5 + Math.random() * 3;
  const totalDeg = spins * 360 + targetAngle;
  const startRot=rotation,endRot=startRot+totalDeg,dur=5000,t0=performance.now();

  function anim(now){
    const p=Math.min((now-t0)/dur,1),eased=1-Math.pow(1-p,4);
    document.getElementById('wheel').style.transform=`rotate(${startRot+totalDeg*eased}deg)`;
    if(p<1){requestAnimationFrame(anim);}
    else{
      rotation=endRot;
      document.getElementById('wheel').style.transform=`rotate(${endRot}deg)`;
      const norm=((360-(endRot%360))+360)%360,idx=Math.floor(norm/ANG)%N,won=SEGMENTS[idx];

      const box=document.getElementById('resultBox'),val=document.getElementById('resultValue'),sub=document.getElementById('resultSub');
      box.classList.remove('hidden');box.className='result';

      // The mark carries the accent, the title stays type.
      val.textContent = '';
      const mark = document.createElement('span');
      mark.className = 'accent';
      mark.textContent = '►';
      const text = document.createElement('span');
      text.textContent = ' ' + (won.title || won.label);
      val.appendChild(mark);
      val.appendChild(text);

      sub.textContent = 'Als Nächstes dran';

      spinning=false;
      document.getElementById('pointer').classList.remove('active');

      // Hide overlay after showing result
      hideTimeout = setTimeout(() => { hideOverlay(); }, RESULT_DISPLAY_MS);
    }
  }
  requestAnimationFrame(anim);
}

loadIssues();
</script>
</body>
</html>
