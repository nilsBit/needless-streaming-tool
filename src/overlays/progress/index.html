<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Projekt – OBS Overlay</title>
  <link rel="stylesheet" href="/overlay/lexikon.css">
  <style>
    /* Projekt (2026-10-12): the project being worked on, how far it is, and
       the how-manyth stream on it. Hidden while no project is current. */
    .card {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
    }
    .card.visible { display: flex; }
    .name {
      font-size: 1.2rem;
      overflow-wrap: anywhere;
    }
    .bar-outer {
      height: 6px;
      background: var(--lex-rule);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--art);
      transition: width 0.5s ease;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stand {
      font-size: 0.933rem;
      color: var(--color-text);
    }
    .streams {
      font: italic 0.8rem var(--font-body);
      color: var(--lex-faint);
    }
    .done-kicker {
      font-family: var(--font-display);
      font-size: 1.133rem;
      color: var(--art);
    }
    .card.done .bar-outer, .card.done .row { display: none; }
  </style>
</head>
<body>
  <div class="card lex lex-schlank" id="card">
    <span class="done-kicker" id="kicker" hidden>Fertig!</span>
    <span class="name lex-title" id="name"></span>
    <div class="bar-outer"><div class="bar-fill" id="bar"></div></div>
    <div class="row">
      <span class="stand" id="stand"></span>
      <span class="streams" id="streams"></span>
    </div>
  </div>
  <script src="/overlay/boot.js" data-overlay="progress"></script>
  <script>
    var card = document.getElementById('card');
    var kicker = document.getElementById('kicker');
    var nameEl = document.getElementById('name');
    var bar = document.getElementById('bar');
    var standEl = document.getElementById('stand');
    var streamsEl = document.getElementById('streams');
    // While "Fertig!" shows, a plain update (no project now) must not hide it.
    var celebrateUntil = 0;
    var DONE_MS = 8000;

    function show(project) {
      if (Date.now() < celebrateUntil) return;
      card.classList.remove('done');
      kicker.hidden = true;
      if (!project) { card.classList.remove('visible'); return; }
      card.classList.add('visible');
      nameEl.textContent = project.name;
      bar.style.width = (project.pct || 0) + '%';
      standEl.textContent = project.stand;
      streamsEl.textContent = project.live
        ? project.streams + '. Stream'
        : project.streams > 0 ? project.streams + (project.streams === 1 ? ' Stream' : ' Streams') : '';
    }

    function celebrate(data) {
      celebrateUntil = Date.now() + DONE_MS;
      card.classList.add('visible', 'done');
      kicker.hidden = false;
      nameEl.textContent = data.name || '';
      setTimeout(function () { celebrateUntil = 0; load(); }, DONE_MS);
    }

    function load() {
      fetch(`${window.__overlayOrigin}/public/project`)
        .then(function (r) { return r.json(); })
        .then(function (data) { show(data.current); })
        .catch(function () {});
    }

    var ws;
    function connectWS() {
      ws = new WebSocket(`${window.__overlayWs}?overlay=1`);
      ws.onopen = load;
      ws.onmessage = function (msg) {
        try {
          var parsed = JSON.parse(msg.data);
          if (parsed.event === 'project-update' && parsed.data) show(parsed.data.current);
          if (parsed.event === 'project-finished' && parsed.data) celebrate(parsed.data);
          if (parsed.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(parsed.data);
        } catch (e) {}
      };
      ws.onclose = function () { setTimeout(connectWS, 2000); };
      ws.onerror = function () { ws.close(); };
    }
    connectWS();
  </script>
</body>
</html>
