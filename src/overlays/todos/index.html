<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NFS Tasks - OBS Overlay</title>
<link rel="stylesheet" href="/overlay/lexikon.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 20px;
  }

  .container {
    width: 100%;
    max-width: 100%;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Header */
  .header { margin-bottom: 4px; }
  .header h1 { font-size: 1.2rem; }
  .header-sub {
    font-family: var(--font-body);
    font-style: italic;
    font-size: 0.867rem;
    color: var(--lex-faint);
    margin-top: 4px;
  }

  .progress-box { padding: 10px 16px; }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-label {
    font-family: var(--font-display);
    font-size: 0.933rem;
    color: var(--color-secondary);
    letter-spacing: 0;
    font-style: italic;
  }

  .progress-count {
    font-family: var(--font-display);
    font-size: 1.333rem;
    color: var(--color-primary);
  }

  .bar-outer {
    height: 6px;
    background: var(--lex-rule);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--art);
    transition: width 0.5s ease;
  }

  .bar-tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--lex-frame-inner);
  }

  .bar-pct {
    text-align: right;
    font-family: var(--font-display);
    font-size: 0.933rem;
    color: var(--color-secondary);
    margin-top: 4px;
  }

  /* Todo list */
  .todo-list {
    padding: 8px 16px;
    max-height: 400px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--lex-rule);
    animation: slideIn 0.3s ease-out forwards;
    opacity: 0;
    transform: translateX(-20px);
  }

  .todo-item:last-child { border-bottom: none; }

  .checkbox {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 1px solid var(--lex-frame);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--art);
    transition: all 0.2s ease;
  }

  .checkbox.checked { border-color: var(--art); }

  .todo-text {
    flex: 1;
    font-size: 1.067rem;
    color: var(--color-text);
    line-height: 1.5;
    word-break: break-word;
  }

  /* The strike takes the text colour — a rule-coloured one at 15% is invisible. */
  .todo-text.done {
    color: var(--lex-faint);
    text-decoration: line-through;
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    font: italic 0.867rem var(--font-body);
    color: var(--lex-faint);
  }

  .empty-msg {
    text-align: center;
    padding: 24px 0;
    font-family: var(--font-body);
    font-style: italic;
    font-size: 1rem;
    color: var(--lex-faint);
  }

  @keyframes slideIn {
    0% { opacity: 0; transform: translateX(-20px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--lex-frame); border-radius: 3px; }
</style>
</head>
<body>

<div class="container lex">
  <!-- Header -->
  <div class="header lex-schlank">
    <h1 class="lex-kicker">TASKS</h1>
    <div class="header-sub">Mission Board</div>
  </div>

  <!-- Progress -->
  <div class="progress-box lex-schlank">
    <div class="progress-top">
      <span class="progress-label">Fortschritt</span>
      <span class="progress-count" id="progressCount">0/0</span>
    </div>
    <div class="bar-outer">
      <div class="bar-fill" id="barFill" style="width:0%"></div>
      <div class="bar-tick" style="left:10%"></div>
      <div class="bar-tick" style="left:20%"></div>
      <div class="bar-tick" style="left:30%"></div>
      <div class="bar-tick" style="left:40%"></div>
      <div class="bar-tick" style="left:50%"></div>
      <div class="bar-tick" style="left:60%"></div>
      <div class="bar-tick" style="left:70%"></div>
      <div class="bar-tick" style="left:80%"></div>
      <div class="bar-tick" style="left:90%"></div>
    </div>
    <div class="bar-pct" id="barPct">0%</div>
  </div>

  <!-- Todo List -->
  <div class="todo-list lex-schlank" id="todoList">
    <div class="empty-msg">Lade Tasks …</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="openCount">0 offen</span>
    <span>NFS Tasks</span>
  </div>
</div>

<script src="/overlay/boot.js" data-overlay="todos"></script>
<script>
let todos = [];
let projectTitle = '';

async function fetchData() {
  try {
    const res = await fetch(`${window.__overlayOrigin}/public/progress`);
    const data = await res.json();
    const activeItem = (data.items || []).find(i => i.status === 'in_progress');

    if (!activeItem) {
      projectTitle = '';
      todos = [];
    } else {
      projectTitle = activeItem.title;
      todos = activeItem.todos || [];
    }
    render();
  } catch (err) {
    console.error('[Todos] Fetch failed:', err);
  }
}

function render() {
  const total = todos.length;
  const doneCount = todos.filter(t => t.done).length;
  const openCount = total - doneCount;
  const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

  document.getElementById('progressCount').textContent = doneCount + '/' + total;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('barPct').textContent = pct + '%';
  document.getElementById('openCount').textContent = openCount + ' offen';

  const list = document.getElementById('todoList');

  // Update header to show active item title
  const headerEl = document.querySelector('.header h1');
  if (headerEl) {
    headerEl.textContent = projectTitle || 'Tasks';
  }

  if (!projectTitle && total === 0) {
    list.innerHTML = '<div class="empty-msg">Kein aktives Feature</div>';
    return;
  }

  if (total === 0) {
    list.innerHTML = ''
      + '<div class="empty-msg">'
      + '<div style="font-family:var(--font-display);font-size:1.133rem;letter-spacing: 0;font-style: italic;color:var(--color-secondary);margin-bottom:10px;">Noch keine Sub-Tasks</div>'
      + 'Füge welche in der App hinzu —<br/>sie erscheinen hier live.'
      + '</div>';
    return;
  }

  // Sort: open first, then done
  const sorted = [...todos].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (a.sort_order || 0) - (b.sort_order || 0);
  });

  let html = '';
  sorted.forEach((todo, i) => {
    const checkClass = todo.done ? 'checkbox checked' : 'checkbox';
    const textClass = todo.done ? 'todo-text done' : 'todo-text';
    const checkmark = todo.done
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : '';

    html += '<div class="todo-item" style="animation-delay:' + (i * 0.06) + 's">'
      + '<div class="' + checkClass + '">' + checkmark + '</div>'
      + '<span class="' + textClass + '">' + escapeHtml(todo.title) + '</span>'
      + '</div>';
  });

  list.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// WebSocket for live updates
const ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

ws.onmessage = (e) => {
  try {
    const msg = JSON.parse(e.data);
    if (msg.event === 'progress-update') {
      fetchData();
    }
    if (msg.event === 'overlay-config' && window.__applyOverlayConfig) window.__applyOverlayConfig(msg.data);
  } catch {}
};

ws.onclose = () => setTimeout(() => location.reload(), 3000);

fetchData();
</script>
</body>
</html>
