<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Custom Overlay Template</title>

  <!--
    ============================================================
    STREAM TOOLKIT — OVERLAY TEMPLATE
    ============================================================

    Dieses Template ist die Grundlage für eigene Overlays.
    Kopiere diesen Ordner, benenne ihn um, und passe CSS + HTML an.

    REGELN:
    1. Der Ordner-Name = die URL.
       Ordner "mein-overlay" → http://localhost:4000/overlay/mein-overlay/index.html
    2. Trage den Ordner-Namen unten bei data-overlay="..." ein.
       Danach kann die Einstellungs-Seite dieses Overlay einzeln umfärben.
    3. Reset, Transparenz und die Lexikon-Klassen kommen aus
       /overlay/lexikon.css. Nicht noch einmal selbst schreiben.
    4. WebSocket verbindet sich IMMER mit: ws://<host>?overlay=1  (via window.__overlayWs)
    5. Daten holen über: <origin>/public/<endpoint>  (via window.__overlayOrigin)

    VERFÜGBARE WEBSOCKET-EVENTS (jeweils { event, data }):
    - stream-state                                Stream-Status oder Challenge geändert
    - issue-created / issue-updated / issue-deleted   Lose Enden
    - progress-update                             Projekt-Fortschritt oder Todos geändert
    - milestone-trigger                           Achievement ausgelöst
    - milestone-created / milestone-updated / milestone-deleted
    - entry-changed                               Eintragskarte geändert (oder null)
    - character-changed                           dieselbe Karte in der alten Figuren-Form
    - follow-changed                              Worldbuilder folgen / festgepinnt
    - reward-redeemed / reward-updated            Channel Point Reward eingelöst / erledigt
    - reward-leaderboard-update                   Rangliste geändert
    - song-update / song-clear                    Song anzeigen / ausblenden
    - sr-update                                   Song-Wünsche geändert
    - chat-message / chat-remove                  Chat-Nachricht neu / von Mods entfernt ({ ids })
    - poll-update / poll-close / vote-result      Abstimmungen
    - design-created / design-updated / design-deleted
    - compile-pray                                Hype Moment ausgelöst
    - roulette-spin / roulette-result / roulette-cooldown
    - clip-created / clip-updated / clip-deleted / clip-sync-failed / clip-tags-changed
    - obs-status / obs-scene-changed
    - bot-status
    - overlay-config                              Farben oder Schriften geändert

    VERFÜGBARE PUBLIC API ENDPOINTS (kein Token nötig):
    - GET /public/stream-state      → { challenge_title, challenge_status, ... }
    - GET /public/issues            → [ { id, title, status, ... }, ... ]
    - GET /public/progress          → { project_name, items: [ { ..., todos: [...] } ] }
    - GET /public/song-queue        → aktueller Song und Warteschlange
    - GET /public/chat              → die letzten Chat-Nachrichten
    - GET /public/reward-stats/top  → Rangliste (?type=all&limit=3)
    - GET /public/entry             → { card } — die Eintragskarte
    - GET /public/overlay-config    → Farben und Schriften
    Fetch via: fetch(`${window.__overlayOrigin}/public/<endpoint>`)

    DESIGN:
    Benutze den Lexikon-Stil — siehe docs/overlay-lexikon-design.md.
    Gib dem äußeren Kasten eines der drei Gewichte:
      .lex .lex-voll       Rahmen, Siegel, Kapitälchen  (groß, bleibt lange stehen)
      .lex .lex-schlank    eine Kante, kein Rahmen      (klein, dauerhaft sichtbar)
      .lex .lex-fluechtig  nur Schrift und Akzent       (ein paar Sekunden sichtbar)
    Farben und Schriften kommen aus der Einstellungs-Seite.
    Schreibe beides niemals fest in die Datei.
  -->

  <link rel="stylesheet" href="/overlay/lexikon.css">

  <style>
    /* Dein eigenes CSS. Farben und Schriften immer über die Variablen:
       --color-primary / --color-secondary / --color-accent / --color-text
       --color-bg / --color-bg-secondary / --color-bg-opacity
       --font-display / --font-body / --font-size-base
       Dazu die abgeleiteten Töne --lex-rule, --lex-soft, --lex-faint,
       --lex-frame und --art (der Akzent dieses Elements). */

    .overlay { padding: 16px; }

    .card { width: 320px; }

    .title { margin-bottom: 10px; }

    .item {
      padding: 6px 0;
      border-bottom: 1px solid var(--lex-rule);
      animation: fadeIn 0.3s ease forwards;
      opacity: 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .empty-msg {
      color: var(--lex-faint);
      font-style: italic;
      text-align: center;
      padding: 20px;
    }

    /* Animations */
    @keyframes fadeIn {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* Notification (für temporäre Einblendungen) */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      opacity: 0;
      transform: translateX(100px);
      transition: all 0.4s ease;
    }

    .notification.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .notification.hiding {
      opacity: 0;
      transform: translateY(-20px);
    }
  </style>
</head>
<body>

  <!-- =============================================
       DEIN HTML
       Passe die Struktur an dein Overlay an.
       ============================================= -->
  <div class="overlay">
    <div class="card lex lex-voll">
      <div class="title lex-kicker">Mein Overlay</div>
      <div id="content">
        <div class="empty-msg">Lade Daten …</div>
      </div>
    </div>
  </div>

  <!-- Holt Farben und Schriften, setzt window.__overlayOrigin und
       window.__overlayWs. Ordner-Namen bei data-overlay eintragen! -->
  <script src="/overlay/boot.js" data-overlay="CHANGEME"></script>
  <script>
    // =============================================
    // KONFIGURATION
    // Passe diese Werte an dein Overlay an.
    // =============================================
    const OVERLAY_NAME = 'MeinOverlay';              // Für Logs
    const API_ENDPOINT = '/public/issues';            // Welche Daten holen
    const WS_EVENTS = ['issue-created', 'issue-updated', 'issue-deleted']; // Auf welche Events reagieren
    const POLL_INTERVAL = 10000;                      // Backup-Polling in ms (0 = aus)

    // =============================================
    // DATEN
    // =============================================
    let data = [];

    // HTML escapen (IMMER verwenden bei User-Input!)
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // =============================================
    // DATEN LADEN
    // =============================================
    async function fetchData() {
      try {
        const res = await fetch(`${window.__overlayOrigin}` + API_ENDPOINT);
        data = await res.json();
        render();
      } catch (err) {
        console.error('[' + OVERLAY_NAME + '] Fetch failed:', err);
      }
    }

    // =============================================
    // RENDERN
    // Hier baust du dein HTML zusammen.
    // =============================================
    function render() {
      const container = document.getElementById('content');

      // Array oder Object?
      const items = Array.isArray(data) ? data : data.items || [];

      if (items.length === 0) {
        container.innerHTML = '<div class="empty-msg">Keine Daten</div>';
        return;
      }

      let html = '';
      items.forEach(function(item, i) {
        html += '<div class="item" style="animation-delay:' + (i * 0.05) + 's">'
          + escapeHtml(item.title || item.name || JSON.stringify(item))
          + '</div>';
      });

      container.innerHTML = html;
    }

    // =============================================
    // WEBSOCKET VERBINDUNG
    // (Normalerweise nicht ändern!)
    // =============================================
    let ws;

    function connectWS() {
      ws = new WebSocket(`${window.__overlayWs}?overlay=1`);

      ws.onopen = function() {
        console.log('[' + OVERLAY_NAME + '] WebSocket connected');
        fetchData(); // Daten laden bei Verbindung
      };

      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);

          // Farben oder Schriften geändert → sofort übernehmen, ohne Reload
          if (msg.event === 'overlay-config' && window.__applyOverlayConfig) {
            window.__applyOverlayConfig(msg.data);
          }

          // Prüfen ob das Event für uns relevant ist
          var isRelevant = WS_EVENTS.some(function(evt) {
            return msg.event === evt || msg.event && msg.event.startsWith(evt);
          });

          if (isRelevant) {
            fetchData(); // Neu laden bei relevantem Event
          }

          // Optional: Direkt auf Event-Daten reagieren
          // if (msg.event === 'mein-event') {
          //   showNotification(msg.data);
          // }
        } catch (err) {}
      };

      ws.onclose = function() {
        console.log('[' + OVERLAY_NAME + '] WebSocket closed, reconnecting...');
        setTimeout(connectWS, 2000);
      };

      ws.onerror = function() {
        ws.close();
      };
    }

    // =============================================
    // HILFSFUNKTIONEN
    // =============================================

    // Temporäre Notification anzeigen (für Alerts etc.)
    // Erstelle ein Element mit class="notification" im HTML
    function showNotification(element, durationMs) {
      durationMs = durationMs || 5000;
      element.classList.add('visible');
      setTimeout(function() {
        element.classList.add('hiding');
        element.classList.remove('visible');
        setTimeout(function() {
          element.classList.remove('hiding');
        }, 500);
      }, durationMs);
    }

    // =============================================
    // START
    // =============================================
    connectWS();

    // Backup-Polling (falls WebSocket kurz weg ist)
    if (POLL_INTERVAL > 0) {
      setInterval(fetchData, POLL_INTERVAL);
    }
  </script>
</body>
</html>
